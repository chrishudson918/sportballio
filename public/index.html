<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportballio</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }
        h1 { margin-top: 0; color: #38bdf8; }
        code {
            background: #0f172a;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            display: block;
            margin: 1rem 0;
            word-break: break-all;
            color: #4ade80;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sportballio</h1>
        <p>Add-on is running successfully on port <strong>2323</strong>!</p>
        <p>Use the manifest URL below to install in Nuvio or Stremio:</p>
        <code id="manifest-url">/manifest.json</code>
    </div>
    <script>
        document.getElementById('manifest-url').innerText = window.location.origin + '/manifest.json';
    </script>
</body>
</html>
