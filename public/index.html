<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sportballio Configurator</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e293b;
            padding: 2.5rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            max-width: 480px;
            width: 100%;
        }
        h1 { margin-top: 0; color: #38bdf8; text-align: center; }
        .form-group { margin-bottom: 1.25rem; text-align: left; }
        label { display: block; margin-bottom: 0.5rem; font-weight: 600; color: #94a3b8; }
        input, select {
            width: 100%;
            padding: 0.75rem;
            border-radius: 6px;
            border: 1px solid #334155;
            background-color: #0f172a;
            color: #fff;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            background-color: #0284c7;
            color: white;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 1rem;
        }
        button:hover { background-color: #0369a1; }
        .result-box {
            margin-top: 1.5rem;
            display: none;
            background: #0f172a;
            padding: 1rem;
            border-radius: 6px;
            word-break: break-all;
            border: 1px solid #334155;
        }
        code { color: #4ade80; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sportballio Config</h1>
        
        <div class="form-group">
            <label for="provider">Select Stream Provider / Source</label>
            <select id="provider">
                <option value="default">Default Sports IPTV</option>
                <option value="custom">Custom Provider</option>
            </select>
        </div>

        <div class="form-group">
            <label for="apiKey">Provider API Key / Token (Optional)</label>
            <input type="text" id="apiKey" placeholder="Enter API Key if required">
        </div>

        <button onclick="generateManifest()">Generate Install Link</button>

        <div id="resultBox" class="result-box">
            <p style="margin-top:0; font-size: 0.9rem; color: #94a3b8;">Copy this Manifest URL into Nuvio / Stremio:</p>
            <code id="manifestUrl"></code>
            <button onclick="installAddon()" style="background-color: #16a34a; margin-top: 0.75rem;">Install to Stremio</button>
        </div>
    </div>

    <script>
        function generateManifest() {
            const provider = document.getElementById('provider').value;
            const apiKey = encodeURIComponent(document.getElementById('apiKey').value.trim());
            
            let configPath = '';
            if (apiKey || provider !== 'default') {
                configPath = `/config=${provider}:${apiKey}`;
            }

            const manifestFullUrl = window.location.origin + configPath + '/manifest.json';
            
            document.getElementById('manifestUrl').innerText = manifestFullUrl;
            document.getElementById('resultBox').style.display = 'block';
        }

        function installAddon() {
            const url = document.getElementById('manifestUrl').innerText;
            const stremioUrl = url.replace(/^https?:\/\//, 'stremio://');
            window.location.href = stremioUrl;
        }
    </script>
</body>
</html>
